name: Windows preview

on:
  push:
    branches: [main, feature/windows-manager]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/build.ps1
      - run: go test -tags desktop ./...
      - run: go vet -tags desktop ./...
      - run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LocalProjectHub-Windows-x64
          path: |
            build/out/LocalProjectHub-Setup-x64.exe
            build/out/LocalProjectHub-Setup-x64.exe.sha256
          if-no-files-found: error
